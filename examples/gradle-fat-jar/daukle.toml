schema = 1
project = "daukle/example-gradle-fat-jar"
version = "1.0.0"

[modules]

[resolvers.github]
url = "https://raw.githubusercontent.com/daukle/daukle/1f515141e06d16eace718a45944a39933611fa39/plugins/github-releases.lua"
sha256 = "3789865c266eb53fafcf7300d77a24461170c615195d92d0ddf88078c556e23e"

[plugins]
maven  = { resolver = "github", coordinate = "daukle/maven@^1.1.0" }
gradle = { resolver = "github", coordinate = "daukle/gradle@^1.3.0" }

# This block is what produced `daukle/maven/classpath.lua`, which is committed
# and which daukle loads by itself. `daukle maven:resolve
# --resolve` fetches both closures, hashes every jar and writes them as pinned
# entries. The result is committed on purpose: a pinned closure belongs in the
# project's history, and a plugin is applied FROM a jar, so there is nothing to
# apply until one is there. Run it again when you change a coordinate.
[toolchains.maven]
for = "gradle"
coordinates = ["org.apache.commons:commons-lang3:3.17.0"]

  # The plugin's own closure, from the Plugin Portal rather than Central, and
  # into its own key. Nineteen modules, none of which this project compiles
  # against: they are what Gradle loads to HAVE the plugin.
  [[toolchains.maven.resolve]]
  repository  = "https://plugins.gradle.org/m2"
  for         = "gradle"
  into        = "pluginClasspath"
  coordinates = ["com.gradleup.shadow:shadow-gradle-plugin:9.3.2"]

[toolchains.gradle]
version = "9.6.0"
main    = "com.example.Main"
tasks   = ["shadowJar", "runShadow"]

[[toolchains.gradle.plugins]]
id      = "com.gradleup.shadow"
version = "9.3.2"

# `enableAutoRelocation` is shadow 9's spelling; 8.x called it
# `enableRelocation` and 9 answers that with "Could not set unknown property".
# Both are properties, which is why they are expressible here at all: shadow's
# other spelling is `relocate 'a', 'b'`, a method call, and this surface is data.
[toolchains.gradle.configure.shadowJar]
enableAutoRelocation = true
relocationPrefix     = "com.example.shaded"
