plugins {
  id 'java'
}

version = '1.0.0'

// The same Test task holding an action: no key says "run this code", so the
// registration is carried and the set stays a plain one.
sourceSets {
  integration
}

tasks.register('integration', Test) {
  testClassesDirs = sourceSets.integration.output.classesDirs
  classpath = sourceSets.integration.runtimeClasspath
  useJUnitPlatform()
  doLast { println 'integration ran' }
}
