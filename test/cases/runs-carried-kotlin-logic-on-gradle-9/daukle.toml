schema = 1
project = "example/greeter"
version = "1.0.0"

[modules]

[plugins]
gradle = "./plugins"

# Carried Kotlin is spliced into a generated build.gradle.kts, the only place its
# accessors compile. The pinned third-party plugin is what puts the classpath in
# settings.gradle: the carried text configures it through its own accessor and
# through its class, which an import lifted above the wrapper's blocks names.
[toolchains.gradle]
version = "9.6.0"
logic = "daukle/gradle/logic/root/root.gradle.kts"

[[toolchains.gradle.plugins]]
id = "org.barfuin.gradle.taskinfo"
version = "2.2.0"

[[toolchains.gradle.pluginClasspath]]
url = "https://plugins.gradle.org/m2/org/barfuin/gradle/taskinfo/gradle-taskinfo/2.2.0/gradle-taskinfo-2.2.0.jar"
sha256 = "ebf2dc6a475b8790a0fb0b92f7329c7f3f0012493a16759097a5c86ee28dc60c"
as = "gradle-taskinfo 2.2.0"
