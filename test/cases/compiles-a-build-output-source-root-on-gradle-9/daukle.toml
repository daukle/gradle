schema = 1
project = "example/greeter"
version = "1.0.0"

[modules]

[plugins]
gradle = "./plugins"

# A generated source root named relative to the build directory, wherever
# daukle put it: the carried task writes there and compileJava reads there.
[toolchains.gradle]
version = "9.6.0"
sourceRoot = ["src/main/java", { buildOutput = "generated/config" }]

[toolchains.gradle.verbatim]
groovy = '''
tasks.register('generateGreeting') {
    def target = layout.buildDirectory.file('generated/config/example/Generated.java')
    outputs.file(target)
    doLast {
        def file = target.get().asFile
        file.parentFile.mkdirs()
        file.text = 'package example; public class Generated { public static String text() { return "generated"; } }'
    }
}

tasks.named('compileJava') {
    dependsOn('generateGreeting')
}
'''
