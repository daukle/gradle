schema = 1
project = "example/greeter"
version = "1.0.0"

[modules]

[plugins]
gradle = "./plugins"

# `jar` is a task, not an extension: a configure key names either, and this one
# needs no downloaded tool, so the jar's file name is the proof Gradle read it.
[toolchains.gradle]
release = "8"
version = "9.6.0"

[toolchains.gradle.configure.jar]
archiveBaseName = "renamed"
