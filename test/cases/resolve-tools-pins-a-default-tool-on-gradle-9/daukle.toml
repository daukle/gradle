schema = 1
project = "example/greeter"
version = "1.0.0"

[modules]

[plugins]
gradle = "./plugins"

# checkstyle's default tool is a coordinate Gradle derives from toolVersion; nothing here names it.
[toolchains.gradle]
release = "8"
version = "9.6.0"
plugins = [{ id = "checkstyle" }]

[toolchains.gradle.configure.checkstyle]
toolVersion = "10.12.0"
