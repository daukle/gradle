schema = 1
project = "example/catalogued"
version = "1.0.0"

[modules]

[plugins]
gradle = "./plugins"

# The real gradle/libs.versions.toml names another gson than the catalog the key
# declares, so a green case proves carried code read the KEYED file and that the
# conventional one, still linked into the derived root, did not register libs too.
[toolchains.gradle]
version = "7.6.4"

[toolchains.gradle.verbatim]
groovy = '''
tasks.named('classes') {
    doLast {
        println 'catalog gson is ' + libs.versions.gson.get()
        println 'catalog library is ' + libs.gson.get()
    }
}
'''

[toolchains.gradle.catalogs.libs.versions]
gson = "2.10.1"

[toolchains.gradle.catalogs.libs.libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
