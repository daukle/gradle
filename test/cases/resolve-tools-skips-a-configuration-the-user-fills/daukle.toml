schema = 1
project = "example/greeter"
version = "1.0.0"

[modules]

[plugins]
gradle = "./plugins"
maven = { url = "https://github.com/daukle/maven/releases/download/1.5.0/plugin.lua", sha256 = "fd8fcdc096c6f89a0e0429356d666480b5379b2a6f13532d1a3788b2c094e884" }

# checkstyle is pinned by hand and jacocoAgent is named by an "into", so only jacocoAnt is left.
[toolchains.gradle]
release = "8"
version = "9.6.0"
plugins = [{ id = "checkstyle" }, { id = "jacoco" }]

[toolchains.gradle.configure.checkstyle]
toolVersion = "10.12.0"

[[toolchains.gradle.configurations.checkstyle]]
url = "https://repo1.maven.org/maven2/com/puppycrawl/tools/checkstyle/10.12.0/checkstyle-10.12.0.jar"
sha256 = "a8b15de4e5b0f3157f6a5d3bda9aacece3a793a9fbe133844817434afa60c820"
as = "checkstyle 10.12.0"

[toolchains.maven]
for = "gradle"

[[toolchains.maven.resolve]]
coordinates = ["org.jacoco:org.jacoco.agent:0.8.14"]
into = ["configurations", "jacocoAgent"]
