schema = 1
project = "example/composite"
version = "1.0.0"

[modules]

[plugins]
gradle = "./plugins"

# An included build declares its own catalog, which its carried logic reads. The
# file sits under the main build's daukle/gradle/, so the build's settings reach
# it from build/daukle/gradle/included/greeting/.
[toolchains.gradle]
version = "9.6.0"
main = "example.App"
requiresBuilds = ["greeting"]

[toolchains.gradle.builds.greeting.verbatim]
groovy = '''
tasks.named('compileJava') {
    doLast { println 'included catalog gson is ' + libs.versions.gson.get() }
}
'''

[toolchains.gradle.builds.greeting.catalogs.libs.versions]
gson = "2.10.1"
