schema = 1
project = "example/two"
version = "1.0.0"

[modules.app]
requires = ["lib"]

[modules.lib]

[plugins]
gradle = "./plugins"

# A module carrying Kotlin beside one carrying Groovy, on Gradle 7: every module
# of a build that carries logic runs from its real directory, and a module's
# Kotlin wrapper reaches its Groovy render through rootProject.file.
[toolchains.gradle]
version = "7.6.4"

[toolchains.gradle.modules.app.verbatim]
kotlin = '''
val generateConfig by tasks.registering {
    doLast { println("app generateConfig ran in " + projectDir.name) }
}

tasks.compileJava {
    dependsOn(generateConfig)
}
'''

[toolchains.gradle.modules.lib.verbatim]
groovy = '''
tasks.named('jar') {
    doLast {
        println 'lib jar carried doLast from ' + project.path
    }
}
'''
