schema = 1
project = "example/rooted"
version = "1.0.0"

[modules.app]

[plugins]
gradle = "./plugins"

# The root project's directory cannot leave build/daukle/gradle, so every
# root-relative form the carried code uses must still reach the REAL file
# through the links there, and a write through one must land in the real tree
# as it did in the old build. A module reads its own real directory.
[toolchains.gradle]
version = "9.6.0"

[toolchains.gradle.verbatim]
groovy = '''
tasks.register('readTheRoot') {
    doLast {
        println 'rootProject.file reads ' + rootProject.file('config/greeting.txt').text.trim()
        println 'rootDir reads ' + new File(rootDir, 'config/greeting.txt').text.trim()
        println 'root file() reads ' + file('config/greeting.txt').text.trim()
        rootProject.file('config/written.txt').text = 'written through the link'
    }
}
'''

[toolchains.gradle.modules.app.verbatim]
groovy = '''
tasks.register('readTheModule') {
    dependsOn ':readTheRoot'
    doLast {
        println 'module file() reads ' + file('local.txt').text.trim()
        println 'module rootProject.file reads ' + rootProject.file('config/greeting.txt').text.trim()
    }
}

tasks.named('compileJava') {
    dependsOn 'readTheModule'
}
'''
