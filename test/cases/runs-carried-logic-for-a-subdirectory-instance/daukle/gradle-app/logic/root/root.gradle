def generatedSources = layout.buildDirectory.dir('generated/sources/carried')

tasks.register('generateGreeting') {
    outputs.dir(generatedSources)
    doLast {
        def target = generatedSources.get().file('example/Generated.java').asFile
        target.parentFile.mkdirs()
        target.text = 'package example; public class Generated { public static String text() { return "carried"; } }'
    }
}

sourceSets.main.java.srcDir(tasks.named('generateGreeting'))
